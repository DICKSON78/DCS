# Sample nginx configuration for terminating BOT / TIPS / GePG corridor TLS + mTLS
# in front of the DCS API. Place under /etc/nginx/conf.d/dcs.conf
#
# Flow: Gateway --(mTLS, client cert must be in the corridor CA)--> nginx :8443
#          nginx --(HTTP)--> DCS :8080  (TLS between nginx and DCS is optional;
#                                       enable TLS_ENABLED on DCS if required)
#
# Generate a corridor CA + client certs and place them at:
#   /etc/nginx/certs/dcs.crt      server certificate (signed by the corridor CA)
#   /etc/nginx/certs/dcs.key      server private key  (chmod 600, root:root)
#   /etc/nginx/certs/corridor-ca.crt  the CA that signs each gateway client cert
#
# Each participating gateway presents a client cert issued by corridor-ca.crt.
# The proxy strips client-cert details that DCS does not need and forwards
# the raw client certificate in a header only if the backend needs it.

server {
    listen 8443 ssl;
    http2 on;
    server_name api.dcs.example.tz;

    # ---- Server certificate (corridor-signed) ----
    ssl_certificate     /etc/nginx/certs/dcs.crt;
    ssl_certificate_key /etc/nginx/certs/dcs.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:DCSSSL:10m;

    # ---- Mutual TLS: gates must present a corridor-issued client cert ----
    ssl_client_certificate /etc/nginx/certs/corridor-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # ---- Rate limiting across the corridor ----
    limit_req_zone $ssl_client_i_dn zone=dcs_corridor:10m rate=200r/s;

    location / {
        limit_req zone=dcs_corridor burst=400 nodelay;

        # Identify the connected gateway by its client-cert subject (CN)
        set $gateway_cn $ssl_client_s_dn;
        proxy_set_header X-Corridor-Gateway $gateway_cn;

        # Reject replayed/unknown clients before they reach DCS
        if ($ssl_verify_client != SUCCESS) {
            return 401;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health probe does not require a client certificate so monitoring
    # stacks can reach it without holding a corridor cert.
    location = /v1/health {
        ssl_verify_client off;
        proxy_pass http://127.0.0.1:8080/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}